# docker-compose.yml — ambiente de desenvolvimento local
#
# Serviços:
#   postgres          — banco de dados local
#   backend           — API de campanhas/documentos (porta 3001)
#   telephony-handler — webhooks Twilio → watsonx (porta 3000, porta que o Twilio chama)
#
# Uso:
#   docker compose up                    → sobe tudo
#   docker compose up backend            → só o backend
#   docker compose down -v               → derruba e apaga volumes
#
# Para usar o Supabase em vez do postgres local:
#   remova a variável DATABASE_URL dos serviços e configure-a no .env

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: ponte
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d ponte"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://usuario:senha@postgres:5432/ponte
      DIRECT_URL: postgresql://usuario:senha@postgres:5432/ponte
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node prisma/seed.js && node src/server.js"

  telephony-handler:
    build:
      context: ./telephony-handler
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./telephony-handler/.env
    environment:
      # Aponta para o backend dentro da rede docker
      BACKEND_API_URL: http://backend:3000
    depends_on:
      - backend

  # Serviço auxiliar para rodar migrações manualmente:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://usuario:senha@postgres:5432/ponte
      DIRECT_URL: postgresql://usuario:senha@postgres:5432/ponte
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    profiles:
      - tools

volumes:
  postgres_data:
  uploads_data:
